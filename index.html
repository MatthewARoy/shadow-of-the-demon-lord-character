<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger of the Damned — Shadow of the Demon Lord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+SC:wght@400;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="vignette" aria-hidden="true"></div>
<div class="sigil" aria-hidden="true"></div>

<header class="masthead">
  <div class="masthead-title">
    <h1>Ledger <span class="amp">of the</span> Damned</h1>
    <p class="subtitle">A Shadow of the Demon Lord character grimoire &mdash; second inscription</p>
  </div>
  <div class="roster-bar">
    <select id="roster-select" title="Choose a soul"></select>
    <button id="new-char-btn" class="btn" title="Inscribe a new soul">+ New</button>
    <select id="sample-select" title="Load a sample build">
      <option value="">Samples…</option>
    </select>
    <button id="export-btn" class="btn btn-ghost" title="Export this character as JSON">Export</button>
    <button id="import-btn" class="btn btn-ghost" title="Import a character JSON">Import</button>
    <input type="file" id="import-file" accept=".json" hidden>
    <button id="delete-btn" class="btn btn-danger" title="Strike this soul from the ledger">✕</button>
    <div class="roster-overflow">
      <button id="overflow-btn" class="btn overflow-btn" type="button"
              title="More rites" aria-label="More rites" aria-haspopup="true"
              aria-expanded="false" aria-controls="overflow-menu">⋯</button>
      <div id="overflow-menu" class="panel overflow-menu"
           aria-label="Roster rites" hidden>
        <button id="ov-new-btn" class="ov-item" type="button">New Soul</button>
        <label class="ov-item ov-sample">
          <span>Samples</span>
          <select id="ov-sample-select" title="Load a sample build">
            <option value="">Choose…</option>
          </select>
        </label>
        <button id="ov-export-btn" class="ov-item" type="button">Export</button>
        <button id="ov-import-btn" class="ov-item" type="button">Import</button>
        <button id="ov-delete-btn" class="ov-item ov-danger" type="button">Delete Soul</button>
      </div>
    </div>
  </div>
</header>

<nav class="tabs" id="tabs" role="tablist" aria-label="Character sections">
  <button class="tab active" data-tab="build" role="tab" aria-selected="true" aria-controls="tab-build">Build</button>
  <button class="tab" data-tab="sheet" role="tab" aria-selected="false" aria-controls="tab-sheet">Sheet</button>
  <button class="tab" data-tab="spells" role="tab" aria-selected="false" aria-controls="tab-spells">Spells</button>
  <button class="tab" data-tab="paths" role="tab" aria-selected="false" aria-controls="tab-paths">Paths</button>
  <button class="tab" data-tab="gear" role="tab" aria-selected="false" aria-controls="tab-gear">Gear</button>
  <button class="tab" data-tab="dice" role="tab" aria-selected="false" aria-controls="tab-dice">Dice</button>
  <button class="tab" data-tab="lookup" role="tab" aria-selected="false" aria-controls="tab-lookup">Lookup</button>
</nav>

<main id="app">
  <section id="tab-build" class="tab-panel active" role="tabpanel" aria-label="Build"></section>
  <section id="tab-sheet" class="tab-panel" role="tabpanel" aria-label="Sheet"></section>
  <section id="tab-spells" class="tab-panel" role="tabpanel" aria-label="Spells"></section>
  <section id="tab-paths" class="tab-panel" role="tabpanel" aria-label="Paths"></section>
  <section id="tab-gear" class="tab-panel" role="tabpanel" aria-label="Gear"></section>
  <section id="tab-dice" class="tab-panel" role="tabpanel" aria-label="Dice"></section>
  <section id="tab-lookup" class="tab-panel" role="tabpanel" aria-label="Lookup"></section>
  <p id="loading" class="loading">Consulting the archives&hellip;</p>
</main>

<aside id="roll-toast" class="roll-toast" role="status" aria-live="polite"></aside>

<footer class="colophon">
  <p>Shadow of the Demon Lord is &copy; Schwalb Entertainment. This is an unofficial character tool;
  data derived from the Core Rulebook, Occult Philosophy, and Terrible Beauty.</p>
</footer>

<script type="module" src="js/main.js"></script>
</body>
</html>
